<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Physics Ball · Cycle 1</title>
<style>
:root{color-scheme:dark;--white:#f3f7ff;--muted:#a6bbd3;--cyan:#4ee9df;--bg:#0b172b}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--white)}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.top{position:absolute;top:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:start;gap:18px;pointer-events:none;text-shadow:0 2px 12px #071527}
.brand{font-size:25px;font-weight:900;letter-spacing:.05em}.tag{margin-top:4px;color:var(--muted);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.pill{background:#122842cc;border:1px solid #7395ae55;border-radius:100px;padding:10px 16px;font-weight:750;font-size:12px;letter-spacing:.12em}
.bottom{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(570px,calc(100vw - 40px));border-radius:18px;padding:17px 20px;background:#09172ade;border:1px solid #6f9bb64d;box-shadow:0 12px 45px #0813228a}
.hudline{display:flex;justify-content:space-between;gap:15px;margin-bottom:9px;font-size:12px;font-weight:800;letter-spacing:.1em}.readout{color:#80ede6}
.track{width:100%;height:11px;background:#263d53;border-radius:30px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#51e4b9,#a8f66f,#f1d473);border-radius:30px;transition:width .06s linear}
.hint{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:#a5bdd2;font-size:11px;flex-wrap:wrap}
.centerCard{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);width:min(420px,90vw);background:#0a1d32e8;border:1px solid #85b4d266;border-radius:22px;text-align:center;padding:26px 25px;box-shadow:0 30px 70px #06121b9a;pointer-events:none}
.centerCard[hidden]{display:none}.centerCard h1{font-size:31px;margin:0 0 6px}.centerCard p{font-size:14px;color:#b8cedf;line-height:1.6;margin:0}.kbd{display:inline-block;border:1px solid #8bb2d080;border-bottom-width:3px;background:#1a3753;border-radius:5px;padding:2px 7px;font-weight:800;color:#eaf4ff}
@media(max-width:600px){.brand{font-size:20px}.top{left:17px;right:17px;top:16px}.bottom{bottom:13px}.hint{font-size:10px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Physics Ball game scene"></canvas>
<div class="top"><div><div class="brand">PHYSICS BALL</div><div class="tag">Momentum challenge · Level 01</div></div><div class="pill" id="status">READY TO LAUNCH</div></div>
<div class="centerCard" id="message"><h1>Reach the landing platform</h1><p>Hold <span class="kbd">SPACE</span> to charge, release to launch.<br>Use <span class="kbd">←</span> <span class="kbd">→</span> <span class="kbd">↑</span> <span class="kbd">↓</span> to influence the ball's momentum.<br>Cross the ramp and gap. Press <span class="kbd">R</span> to restart.</p></div>
<div class="bottom"><div class="hudline"><span id="powerTitle">LAUNCH POWER</span><span class="readout" id="powerValue">0%</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="hint"><span>HOLD SPACE → RELEASE TO LAUNCH</span><span>ARROWS = FORCE · R = RESTART</span></div></div>
<script>
'use strict';
// Self-contained pseudo-3D canvas scene; no external libraries or assets.
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status'),msg=document.getElementById('message'),fill=document.getElementById('fill'),powerValue=document.getElementById('powerValue'),powerTitle=document.getElementById('powerTitle');
let width=0,height=0,dpr=1,last=0,t=0;
const keys=new Set();
const track={left:-5.6,right:5.6,flatEnd:18,rampEnd:26,landingStart:43,landingEnd:79,rampTop:2.8};
const radius=.95,gravity=12.5;
let ball,charging,power,phase,travel;
function restart(){ball={x:0,y:radius,z:3,vx:0,vy:0,vz:0,spin:0,grounded:true};charging=false;power=0;phase='ready';travel=0;msg.hidden=false;msg.querySelector('h1').textContent='Reach the landing platform';msg.querySelector('p').innerHTML='Hold <span class="kbd">SPACE</span> to charge, release to launch.<br>Use <span class="kbd">←</span> <span class="kbd">→</span> <span class="kbd">↑</span> <span class="kbd">↓</span> to influence the ball\'s momentum.<br>Cross the ramp and gap. Press <span class="kbd">R</span> to restart.';statusEl.textContent='READY TO LAUNCH';powerTitle.textContent='LAUNCH POWER';syncHud();}
function surface(x,z){if(Math.abs(x)>track.right)return null;if(z>=-7&&z<=track.flatEnd)return {h:0,slope:0,kind:'start'};if(z>track.flatEnd&&z<=track.rampEnd)return {h:(z-track.flatEnd)/(track.rampEnd-track.flatEnd)*track.rampTop,slope:track.rampTop/(track.rampEnd-track.flatEnd),kind:'ramp'};if(z>=track.landingStart&&z<=track.landingEnd)return {h:0,slope:0,kind:'goal'};return null;}
function syncHud(){fill.style.width=Math.round(power)+'%';powerValue.textContent=Math.round(power)+'%';}
function launch(){if(phase!=='ready')return;ball.vz=9+power*.26;phase='active';charging=false;msg.hidden=true;statusEl.textContent='IN FLIGHT / ROLLING';powerTitle.textContent='INITIAL POWER';syncHud();}
function finish(win){if(phase!=='active')return;phase=win?'won':'lost';statusEl.textContent=win?'MISSION COMPLETE':'MISSION FAILED';msg.hidden=false;msg.querySelector('h1').textContent=win?'MISSION COMPLETE':'TRY AGAIN';msg.querySelector('p').innerHTML=win?'You used momentum and a ramp to reach the target.<br>Press <span class="kbd">R</span> to replay.':'The ball missed the landing platform.<br>Try a different launch power or steering direction.<br>Press <span class="kbd">R</span> to restart.';}
function tick(dt){t+=dt;if(phase==='ready'){if(charging){power=Math.min(100,power+dt*56);syncHud();}return;}if(phase!=='active')return;
const before=surface(ball.x,ball.z);const wasGrounded=ball.grounded;
const side=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0);
const forward=(keys.has('ArrowUp')?1:0)-(keys.has('ArrowDown')?1:0);
ball.vx+=side*(ball.grounded?10:5)*dt;
ball.vz+=forward*(ball.grounded?3.8:2.4)*dt;
if(ball.grounded){ball.vz-=(before?.slope||0)*gravity*dt;const drag=Math.max(0,1-(before?.kind==='ramp'?.09:.22)*dt);ball.vx*=drag;ball.vz*=drag;}
else{ball.vy-=gravity*dt;ball.vx*=Math.max(0,1-.025*dt);ball.vz*=Math.max(0,1-.018*dt);}
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.z+=ball.vz*dt;ball.spin+=Math.hypot(ball.vx,ball.vz)*dt/radius;travel+=Math.max(0,ball.vz*dt);
const s=surface(ball.x,ball.z);
if(wasGrounded&&s&&ball.y<=s.h+radius+.15){ball.grounded=true;ball.y=s.h+radius;ball.vy=ball.vz*s.slope;}
else if(wasGrounded&&!s){ball.grounded=false;if(before?.kind==='ramp'){ball.vy=ball.vz*before.slope;}else{ball.vy=Math.max(0,ball.vy);}}
else if(!wasGrounded&&s&&ball.vy<=0&&ball.y<=s.h+radius&&ball.y>=s.h+radius-2){ball.grounded=true;ball.y=s.h+radius;ball.vy=0;if(s.kind==='goal'){finish(true);}}
else if(!wasGrounded){ball.grounded=false;}
if(ball.y< -8||ball.z>track.landingEnd+7||ball.z< -14||Math.abs(ball.x)>18){finish(false);}
}
function resize(){const w=window.innerWidth,h=window.innerHeight;dpr=Math.min(2,window.devicePixelRatio||1);width=w;height=h;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}window.addEventListener('resize',resize);resize();
function cam(){const c={x:ball.x*.88,y:ball.y+5.4,z:ball.z-13};const look={x:ball.x*.89,y:ball.y+1.05,z:ball.z+17};const f=norm(sub(look,c));const r=norm({x:f.z,y:0,z:-f.x});const u=cross(f,r);return {c,f,r,u,focus:Math.min(width*1.05,height*1.22)};}
function sub(a,b){return {x:a.x-b.x,y:a.y-b.y,z:a.z-b.z};}
function dot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z;}
function cross(a,b){return {x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x};}
function norm(a){const m=Math.hypot(a.x,a.y,a.z)||1;return {x:a.x/m,y:a.y/m,z:a.z/m};}
function project(p,C){const q=sub(p,C.c);const z=dot(q,C.f);if(z<.25)return null;return {x:width*.5+dot(q,C.r)*C.focus/z,y:height*.535-dot(q,C.u)*C.focus/z,depth:z,scale:C.focus/z};}
let polys=[];
function poly(points,color,C,stroke=null){const ps=points.map(p=>project(p,C));if(ps.some(p=>!p))return;polys.push({ps,color,stroke,depth:ps.reduce((a,p)=>a+p.depth,0)/ps.length});}
function quad(x0,x1,z0,z1,y0,y1,col,C){poly([{x:x0,y:y0,z:z0},{x:x1,y:y0,z:z0},{x:x1,y:y1,z:z1},{x:x0,y:y1,z:z1}],col,C);}
function floorSegment(x0,x1,z0,z1,y0,y1,C,base){quad(x0,x1,z0,z1,y0,y1,base,C);poly([{x:x0,y:y0,z:z0},{x:x0,y:y1,z:z1},{x:x0,y:y1-1.5,z:z1},{x:x0,y:y0-1.5,z:z0}],'#324a62',C);poly([{x:x1,y:y0,z:z0},{x:x1,y:y1,z:z1},{x:x1,y:y1-1.5,z:z1},{x:x1,y:y0-1.5,z:z0}],'#253b50',C);}
function world(C){polys=[];
// Far-to-near faces get painter-sorted using camera depth.
quad(-200,200,-140,260,-12,-12,'#0e2938',C);
// Landing platform, approach slab, and raised ramp.
floorSegment(-5.6,5.6,43,79,0,0,C,'#1b786e');
floorSegment(-5.6,5.6,18,26,0,2.8,C,'#6f87a4');
floorSegment(-5.6,5.6,-7,18,0,0,C,'#526b85');
for(let z=-5;z<79;z+=3.5){if(z>26&&z<43)continue;const a=surface(0,z),b=surface(0,z+Math.min(3.3,79-z));if(!a||!b||a.kind!==b.kind)continue;quad(-5.45,5.45,z,z+.06,a.h,b.h,'#ffffff13',C);}
// Board edges make fall boundaries visible.
for(const [z0,z1,h0,h1] of [[-7,18,0,0],[18,26,0,2.8],[43,79,0,0]]){for(const x of [-5.55,5.55]){const ps=[{x,y:h0+.05,z:z0},{x,y:h1+.05,z:z1}].map(p=>project(p,C));if(ps.every(Boolean))polys.push({ps,color:'#b3d2ed',stroke:null,depth:(ps[0].depth+ps[1].depth)/2,line:true});}}
polys.sort((a,b)=>b.depth-a.depth);
for(const p of polys){ctx.beginPath();p.ps.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));if(p.line){ctx.strokeStyle=p.color;ctx.lineWidth=3;ctx.stroke();}else{ctx.closePath();ctx.fillStyle=p.color;ctx.fill();if(p.stroke){ctx.strokeStyle=p.stroke;ctx.stroke();}}}
// Landing ring and the direction arrows are drawn as perspective overlays.
const ring=[];for(let k=0;k<=40;k++){const a=Math.PI*2*k/40;ring.push(project({x:Math.cos(a)*3.15,y:.08,z:55+Math.sin(a)*3.15},C));}if(ring.every(Boolean)){ctx.beginPath();ring.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#a2ffe6';ctx.lineWidth=Math.max(2,ring[0].scale*.18);ctx.stroke();}
for(let z of [7,13,20,24]){const s=surface(0,z);if(!s)continue;const p0=project({x:0,y:s.h+.07,z},C),p1=project({x:0,y:s.h+.07,z:z+1.5},C);if(p0&&p1){ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.strokeStyle='#eaf8ffbd';ctx.lineWidth=Math.max(2,p0.scale*.12);ctx.stroke();}}
const g=project({x:0,y:.18,z:55},C);if(g&&g.scale>.2){ctx.textAlign='center';ctx.font=`800 ${Math.max(12,Math.min(22,g.scale*.7))}px system-ui`;ctx.fillStyle='#d2fff5';ctx.fillText('TARGET',g.x,g.y-14);}
}
function drawBall(C){const center=project(ball,C);if(!center)return;const r=Math.max(5,center.scale*radius);const x=center.x,y=center.y;
// Contact shadow on the surface when near it.
const s=surface(ball.x,ball.z);if(s){const shadow=project({x:ball.x,y:s.h+.02,z:ball.z},C);if(shadow){ctx.save();ctx.translate(shadow.x,shadow.y);ctx.scale(1,.38);const grad=ctx.createRadialGradient(0,0,1,0,0,r*1.8);grad.addColorStop(0,'#051d2688');grad.addColorStop(1,'#051d2600');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r*1.8,0,Math.PI*2);ctx.fill();ctx.restore();}}
const grad=ctx.createRadialGradient(x-r*.38,y-r*.45,r*.07,x,y,r*1.13);grad.addColorStop(0,'#f6fcff');grad.addColorStop(.23,'#8ef5e7');grad.addColorStop(.63,'#32a4b9');grad.addColorStop(1,'#153968');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c4fffa99';ctx.lineWidth=Math.max(1,r*.025);ctx.stroke();
ctx.save();ctx.translate(x,y);ctx.rotate(ball.spin);ctx.beginPath();ctx.ellipse(0,0,r*.87,r*.31,0,0,Math.PI*2);ctx.strokeStyle='#ffffff80';ctx.lineWidth=Math.max(1,r*.05);ctx.stroke();ctx.restore();
}
function drawBackground(){const bg=ctx.createLinearGradient(0,0,0,height);bg.addColorStop(0,'#102940');bg.addColorStop(.49,'#25475b');bg.addColorStop(.5,'#234655');bg.addColorStop(1,'#091c2d');ctx.fillStyle=bg;ctx.fillRect(0,0,width,height);ctx.fillStyle='#ffffff0b';for(let i=0;i<32;i++){const x=(i*157+38)%width,y=((i*61+18)%Math.max(1,height*.48));ctx.fillRect(x,y,2,2);}}
function render(){drawBackground();const C=cam();world(C);drawBall(C);if(phase==='ready'){ctx.save();ctx.textAlign='center';ctx.fillStyle='#e3fbff';ctx.font='bold 13px system-ui';ctx.fillText('CHARGE TO CROSS THE GAP',width/2,height*.27);ctx.restore();}}
function frame(stamp){const dt=Math.min(.04,(stamp-last)/1000||.016);last=stamp;const n=Math.max(1,Math.ceil(dt/.012));for(let i=0;i<n;i++)tick(dt/n);render();requestAnimationFrame(frame);}
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyR'&&!e.repeat){keys.clear();restart();return;}if(e.code==='Space'&&phase==='ready'&&!e.repeat){charging=true;msg.hidden=true;}keys.add(e.code);});
window.addEventListener('keyup',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys.delete(e.code);if(e.code==='Space'&&phase==='ready'&&charging)launch();});
window.addEventListener('blur',()=>{keys.clear();if(phase==='ready'&&charging){charging=false;msg.hidden=false;}});
restart();requestAnimationFrame(frame);
</script>
</body>
</html>
